# Don't print a new line at the start of the prompt
add_newline = false

format = """$all $directory ${custom.jj} $python
$character"""
# format = """
# $directory $time $rust$package(bold green)
# -> %"""

# # Replace the "❯" symbol in the prompt with "➜"
# [character]                            # The name of the module we are configuring is "character"
# success_symbol = "[➜](bold green)"     # The "success_symbol" segment is being set to "➜" with the color "bold green"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[directory]
truncate_to_repo = false
truncation_length = 10
repo_root_style = 'underline bold cyan'
format = '[\[$path\]]($style)'

[time]
disabled = false
format = '[\[ $time \]]($style)'
style = 'bold blue'

[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

[git_status]
disabled = true

[git_branch]
disabled = true
format = "[$branch]($style)"

[git_commit]
disabled = true

[git_state]
disabled = true

[docker_context]
disabled = true

[python]
disabled = false
format = '[(\($virtualenv\) )]($style)'

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[aws]
disabled = true

[pijul_channel]
disabled = true

[bun]
disabled = true
